name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (syntax check)
        run: python -m compileall app producer ml scripts tests

      - name: Run unit tests
        run: python -m pytest -q

      - name: Validate dbt project structure
        run: |
          pip install dbt-core==1.8.6 dbt-postgres==1.8.2
          cd dbt && dbt parse --profiles-dir .

      - name: Validate docker compose
        run: docker compose config

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: |
          docker compose build app api spark airflow
